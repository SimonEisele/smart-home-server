<div class="consent-banner" *ngIf="(consentState$ | async) === null">
  <div class="consent-card">
    <p>
      {{ 'consent.message' | translate }}
      <a [routerLink]="['/', currentLanguage, 'privacy_policy']">{{ 'consent.privacyLink' | translate }}</a>
    </p>
    <div class="consent-actions">
      <button class="button-secondary" type="button" (click)="rejectConsent()">{{ 'consent.decline' | translate }}</button>
      <button class="button-primary" type="button" (click)="acceptConsent()">{{ 'consent.accept' | translate }}</button>
    </div>
  </div>
</div>
