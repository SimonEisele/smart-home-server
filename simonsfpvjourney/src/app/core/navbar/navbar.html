<nav class="navbar navbar-dark fixed-top navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/', currentLanguage]" [attr.aria-label]="'nav.homeAria' | translate">
      <img class="brand-logo" src="assets/logo.png" alt="Simons FPV Journey" />
      <span class="brand-text">Simons FPV Journey</span>
    </a>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler"
      type="button"
      aria-controls="fpvNavbar"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="fpvNavbar" [class.show]="isMenuOpen">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

        <li class="nav-item">
          <a class="nav-link fpv-link" [routerLink]="['/', currentLanguage]" [class.active]="isMapActive()" (click)="closeMenu()">
            {{ 'nav.map' | translate }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fpv-link" [routerLink]="['/', currentLanguage, 'videos']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            {{ 'nav.videos' | translate }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fpv-link" [routerLink]="['/', currentLanguage, 'pictures']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            {{ 'nav.pictures' | translate }}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fpv-link" [routerLink]="['/', currentLanguage, 'gear']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            {{ 'nav.drones' | translate }}
          </a>
        </li>

        <li class="nav-item nav-language">
          <label class="sr-only" for="languageSelect">{{ 'nav.language' | translate }}</label>
          <select id="languageSelect" (change)="onLanguageChange($any($event.target).value)">
            <option *ngFor="let lang of languages" [value]="lang.code" [selected]="lang.code === currentLanguage">{{ lang.label }}</option>
          </select>
        </li>
      </ul>
    </div>
  </div>
</nav>
