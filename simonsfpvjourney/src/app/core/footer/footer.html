<footer class="fpv-footer">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>simonsfpvjourney</h3>
        <p>{{ 'footer.tagline' | translate }}</p>
      </div>

      <div class="footer-links">
        <a [routerLink]="['/', currentLanguage]">{{ 'nav.home' | translate }}</a>
        <a [routerLink]="['/', currentLanguage, 'videos']">{{ 'nav.videos' | translate }}</a>
        <a [routerLink]="['/', currentLanguage, 'pictures']">{{ 'nav.pictures' | translate }}</a>
        <a [routerLink]="['/', currentLanguage, 'gear']">{{ 'nav.drones' | translate }}</a>
      </div>

      <div class="footer-social">
        <a href="https://www.youtube.com/channel/UCSVEq_1yWO5-mQoHUcJmhFA" target="_blank" aria-label="YouTube">
          <i class="fab fa-youtube"></i> YouTube
        </a>
        <a href="https://www.instagram.com/simonsfpvjourney/" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i> Instagram
        </a>
      </div>
    </div>

    <div class="footer-legal">
      <span>© 2026 Simon Eisele | <a [routerLink]="['/', currentLanguage, 'privacy_policy']">{{ 'footer.privacy' | translate }}</a></span>
    </div>
  </div>
</footer>

<!-- Floating Feedback Button and Modal -->
<button class="feedback-fab" [attr.title]="'feedback.title' | translate" (click)="isFeedbackOpen = true">
  ✉️
</button>
<app-feedback-modal [open]="isFeedbackOpen" (closed)="isFeedbackOpen = false"></app-feedback-modal>
