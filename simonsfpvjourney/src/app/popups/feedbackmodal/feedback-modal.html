<div *ngIf="open" class="modal-backdrop" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()" #contentRoot tabindex="0" role="dialog" aria-modal="true">
    <button class="close-btn" (click)="onClose()" [attr.aria-label]="'common.close' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="modal-body">
      <h3 class="fb-title">{{ 'feedback.title' | translate }}</h3>
      <p class="fb-sub">{{ 'feedback.subtitle' | translate }}</p>

      <div class="fb-field">
        <label>{{ 'feedback.category' | translate }}</label>
        <app-custom-select
          [options]="categoryOptions"
          [value]="category"
          [placeholder]="'feedback.categorySelect' | translate"
          (valueChange)="category = $event ?? ''">
        </app-custom-select>
      </div>

      <div class="fb-field">
        <label>{{ 'feedback.message' | translate }}<span>*</span></label>
        <textarea id="feedback-message" [(ngModel)]="message" rows="4" [placeholder]="'feedback.messagePlaceholder' | translate" (input)="onInputMessage()" [disabled]="submitting"></textarea>
        <div class="error" *ngIf="messageErrorKey">{{ messageErrorKey | translate }}</div>
      </div>

      <div class="fb-grid">
        <div class="fb-field">
          <label>{{ 'feedback.name' | translate }}</label>
          <input [(ngModel)]="name" type="text" [placeholder]="'feedback.optional' | translate" />
        </div>
        <div class="fb-field">
          <label>{{ 'feedback.contact' | translate }}</label>
          <input [(ngModel)]="contact" type="text" [placeholder]="'feedback.contactPlaceholder' | translate" />
        </div>
      </div>

      <div class="fb-actions">
        <button class="fb-submit" [disabled]="submitting" (click)="submit()">
          {{ submitting ? ('feedback.sending' | translate) : ('feedback.send' | translate) }}
        </button>
      </div>

      <p class="fb-success" *ngIf="success">{{ 'feedback.success' | translate }}</p>
      <p class="fb-error" *ngIf="errorKey">{{ errorKey | translate }}</p>
    </div>
  </div>
</div>
