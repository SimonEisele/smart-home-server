<div class="page-shell not-found-page">
  <main class="not-found-main" role="main">
    <div class="not-found-hero">
      <svg class="not-found-icon" width="100" height="100" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- head -->
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/>
        <!-- X eyes -->
        <path d="M8.5 9.2L10.2 10.9M10.2 9.2L8.5 10.9"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M13.8 9.2L15.5 10.9M15.5 9.2L13.8 10.9"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <!-- confused mouth -->
        <path d="M9 15.5c1-.8 2-.8 3 0s2 .8 3 0"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>

      <div class="not-found-copy-block">
        <h1 class="page-title">{{ 'notFound.title' | translate }}</h1>
        <p class="page-subtitle">{{ 'notFound.copy' | translate }}</p>
      </div>
    </div>

    <div class="not-found-actions">
      <a class="map-link-btn not-found-button" [routerLink]="['/', currentLanguage]">{{ 'notFound.backHome' | translate }}</a>
    </div>
  </main>
</div>
