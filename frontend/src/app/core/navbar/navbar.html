<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Smart Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/appointements">Termine</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/shoppinglist">Einkaufsliste</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/todos">Todos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/weather">Wetter</a>
        </li>
      </ul>
      <button (click)="openFullscreen()">Vollbild</button>
      <button (click)="dashboardService.toggleEditMode()">
        {{ (editMode$ | async) ? 'Bearbeiten beenden' : 'Bearbeiten' }}
      </button>
      <div class="d-flex">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item" *ngIf="user$ | async as user">
            <a class="nav-link no-hover disabled">Hallo, {{ user.first_name }}</a>
          </li>
          <li class="nav-item" *ngIf="!(user$ | async)">
            <button #loginButton class="nav-link" (click)="toggleLogin()">Login</button>
          </li>
        </ul>
        <button class="nav-link" id="accountButton">
          <img src="icons/person.svg" alt="Account" width="40" height="40">

<login-popover *ngIf="showLogin" class="login-popover" [style.top.px]="loginPopoverTop" [style.left.px]="loginPopoverLeft" (loginSuccess)="onLoginSuccess()" (close)="showLogin = false"></login-popover>
