<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand nav-link" routerLink="/home">Smart Home</a>
    <button class="navbar-toggler" type="button" (click)="toggleMenu()" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent" #navbarCollapse>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" *ngIf="user$ | async">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/calendar" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Kalender</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/shoppinglist" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Einkaufsliste</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/todos" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Todos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/weather" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Wetter</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/menuplan" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Menüplan</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/recipes" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Rezepte</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/ingredients" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Zutaten</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/cleaning" (click)="closeMenu()" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">Reinigung</a>
        </li>
      </ul>

      <!-- Right section -->
      <div class="navbar-right">
        <div class="nav-actions">
          <!-- Edit toggle icon -->
          <button class="nav-icon-btn" (click)="dashboardService.toggleEditMode()" aria-label="Bearbeiten umschalten">
            <ng-container *ngIf="(editMode$ | async); else editIcon">
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </ng-container>
            <ng-template #editIcon>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor"/>
                <path d="M20.71 7.04a1 1 0 0 0 0-1.41L18.37 3.29a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
              </svg>
            </ng-template>
          </button>

          <!-- Fullscreen icon -->
          <button class="nav-icon-btn" (click)="toggleFullscreen(); closeMenu()" [attr.aria-label]="isFullscreen ? 'Vollbild beenden' : 'Vollbild'">
            <ng-container *ngIf="!isFullscreen">
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9V3h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 9V3h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M3 15v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </ng-container>
            <ng-container *ngIf="isFullscreen">
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3v3a1 1 0 0 1-1 1H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16 3v3a1 1 0 0 0 1 1h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M8 21v-3a1 1 0 0 0-1-1H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16 21v-3a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </ng-container>
          </button>
        </div>

        <!-- Vertical separator -->
        <div class="nav-sep"></div>

        <!-- User section (logged in) -->
        <div class="nav-user" *ngIf="user$ | async as user">
          <div class="nav-user-info">
            <span class="nav-user-name">{{ user.first_name }}</span>
            <div class="wg-switcher" *ngIf="(households$ | async) as households">
              <button class="wg-btn" [class.multi]="households.length > 1"
                      (click)="households.length > 1 ? toggleWgDropdown() : null">
                <span class="wg-name">{{ (activeHousehold$ | async)?.name || 'Keine WG' }}</span>
                <svg *ngIf="households.length > 1" class="wg-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </button>
              <div class="wg-dropdown" *ngIf="showWgDropdown && households.length > 1">
                <button *ngFor="let hh of households"
                        class="wg-option"
                        [class.active]="(activeHousehold$ | async)?.id === hh.id"
                        (click)="switchHousehold(hh.id); showWgDropdown = false">
                  <span>{{ hh.name }}</span>
                  <small class="wg-role">{{ hh.role }}</small>
                </button>
                <div class="wg-divider"></div>
                <button class="wg-option wg-manage" (click)="navigateToAccount(); showWgDropdown = false">
                  WG verwalten →
                </button>
              </div>
            </div>
          </div>
          <button #accountButton class="account-btn" (click)="toggleAccount()" aria-label="Konto">
            <svg class="account-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
              <path d="M480-480.67q-66 0-109.67-43.66Q326.67-568 326.67-634t43.66-109.67Q414-787.33 480-787.33t109.67 43.66Q633.33-700 633.33-634t-43.66 109.67Q546-480.67 480-480.67ZM160-160v-100q0-36.67 18.5-64.17T226.67-366q65.33-30.33 127.66-45.5 62.34-15.17 125.67-15.17t125.33 15.5q62 15.5 127.28 45.3 30.54 14.42 48.96 41.81Q800-296.67 800-260v100H160Zm66.67-66.67h506.66V-260q0-14.33-8.16-27-8.17-12.67-20.5-19-60.67-29.67-114.34-41.83Q536.67-360 480-360t-111 12.17Q314.67-335.67 254.67-306q-12.34 6.33-20.17 19-7.83 12.67-7.83 27v33.33ZM480-547.33q37 0 61.83-24.84Q566.67-597 566.67-634t-24.84-61.83Q517-720.67 480-720.67t-61.83 24.84Q393.33-671 393.33-634t24.84 61.83Q443-547.33 480-547.33Z" />
            </svg>
          </button>
        </div>

        <!-- Login button (not logged in) -->
        <button *ngIf="!(user$ | async)" #loginButton class="nav-login-btn" (click)="toggleLogin()">
          Anmelden
        </button>

      </div><!-- /navbar-right -->
    </div><!-- /navbar-collapse -->
  </div><!-- /container-fluid -->
</nav>

<login-popover *ngIf="showLogin" class="login-popover-container" [style.top.px]="loginPopoverTop" [style.left.px]="loginPopoverLeft" [arrowLeft]="loginPopoverArrowLeft"  (loginSuccess)="onLoginSuccess()" (close)="showLogin = false"></login-popover>
<account-popover *ngIf="showAccount" class="account-popover-container" [style.top.px]="accountPopoverTop" [style.left.px]="accountPopoverLeft" [arrowLeft]="accountPopoverArrowLeft" (close)="showAccount = false"></account-popover>
