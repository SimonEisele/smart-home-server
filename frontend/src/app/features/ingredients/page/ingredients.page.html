<div class="ingredients-page app-page">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div class="page-header">
    <div class="header-left">
      <h2 class="page-title">Zutaten-Katalog</h2>
      <span class="count-pill">{{ ingredients.length }}</span>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" [(ngModel)]="search" placeholder="Suchen…" />
      </div>
      <button class="btn-add" (click)="openAdd()" *ngIf="!showAddForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Neue Zutat
      </button>
    </div>
  </div>

  <!-- ── Add form ────────────────────────────────────────────────── -->
  <div class="add-form-panel" *ngIf="showAddForm">
    <h3 class="add-form-title">Neue Zutat erfassen</h3>
    <div class="add-form-row">
      <div class="add-field">
        <label>Name *</label>
        <input type="text" [(ngModel)]="addForm.name" placeholder="z.B. Weizenmehl" />
      </div>
      <div class="add-field">
        <label>Kategorie</label>
        <select [(ngModel)]="addForm.category">
          <option *ngFor="let cat of CATEGORIES" [value]="cat.value">{{ cat.label }}</option>
        </select>
      </div>
      <div class="add-field add-field-grow">
        <label>Unterkategorie <span class="muted">(optional)</span></label>
        <input type="text" [(ngModel)]="addForm.subcategory" placeholder="z.B. Vollkornmehl" />
      </div>
      <div class="add-field add-field-unit">
        <label>Standard-Einheit</label>
        <input type="text" [(ngModel)]="addForm.defaultUnit" placeholder="g, ml, Stk…" />
      </div>
    </div>
    <div class="add-form-actions">
      <button type="button" class="btn-save" (click)="saveAdd()" [disabled]="!addForm.name.trim() || savingAdd">Speichern</button>
      <button type="button" class="btn-cancel-form" (click)="cancelAdd()">Abbrechen</button>
    </div>
  </div>

  <!-- ── Grouped ingredient list ────────────────────────────────── -->
  <div class="category-group" *ngFor="let group of grouped; trackBy: trackByCategory">
    <div class="category-head">
      <span class="category-name">{{ group.label }}</span>
      <span class="category-count">{{ group.items.length }}</span>
    </div>
    <div class="ingredient-table">
      <ng-container *ngFor="let ing of group.items; trackBy: trackByIngId">

        <!-- Edit row -->
        <div class="ingredient-row editing" *ngIf="editId === ing.id">
          <input class="ing-input flex-3" type="text" [(ngModel)]="editForm.name" placeholder="Name" />
          <select class="ing-select" [(ngModel)]="editForm.category">
            <option *ngFor="let cat of CATEGORIES" [value]="cat.value">{{ cat.label }}</option>
          </select>
          <input class="ing-input flex-2" type="text" [(ngModel)]="editForm.subcategory" placeholder="Unterkategorie" />
          <input class="ing-input ing-unit" type="text" [(ngModel)]="editForm.defaultUnit" placeholder="Einheit" />
          <div class="ing-actions">
            <button type="button" class="btn-icon btn-ok" title="Speichern" (click)="saveEdit()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <button type="button" class="btn-icon btn-cancel-icon" title="Abbrechen" (click)="cancelEdit()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <!-- Display row -->
        <div class="ingredient-row" *ngIf="editId !== ing.id">
          <span class="ing-name">{{ ing.name }}</span>
          <span class="ing-sub" *ngIf="ing.subcategory">{{ ing.subcategory }}</span>
          <span class="ing-unit-badge" *ngIf="ing.defaultUnit">{{ ing.defaultUnit }}</span>
          <span class="ing-unit-badge empty" *ngIf="!ing.defaultUnit">—</span>
          <div class="ing-actions">
            <ng-container *ngIf="confirmDeleteId === ing.id; else normalActions">
              <span class="delete-confirm-text">Löschen?</span>
              <button type="button" class="btn-icon btn-ok" title="Ja, löschen" (click)="doDelete(ing.id)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
              </button>
              <button type="button" class="btn-icon btn-cancel-icon" title="Abbrechen" (click)="cancelDelete()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </ng-container>
            <ng-template #normalActions>
              <button type="button" class="btn-icon btn-edit" title="Bearbeiten" (click)="startEdit(ing)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button type="button" class="btn-icon btn-delete-ing" title="Löschen" (click)="confirmDelete(ing.id)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </ng-template>
          </div>
        </div>

      </ng-container>
    </div>
  </div>

  <p class="empty-hint" *ngIf="ingredients.length === 0">Noch keine Zutaten im Katalog. Lege die erste an!</p>
  <p class="empty-hint" *ngIf="ingredients.length > 0 && filtered.length === 0">Keine Treffer für „{{ search }}“.</p>

</div>
