<div class="datetime-widget">
  <div class="time" [attr.aria-label]="now | date:'HH:mm'">
    {{ now | date:'HH:mm' }}<span class="seconds" aria-hidden="true">{{ now | date:'ss' }}</span>
  </div>
  <div class="date">
    <span class="weekday">{{ now | date:'EEEE' }}</span>
    <span>{{ now | date:'d. MMMM yyyy' }}</span>
  </div>
  <div class="day-progress" role="img" [attr.aria-label]="dayProgress + ' % des Tages vorbei'">
    <span class="day-progress-bar" [style.width.%]="dayProgress"></span>
  </div>
  <div class="meta">
    <span>KW {{ weekNumber }}</span>
    <span>{{ dayOfYear }}. Tag</span>
  </div>
</div>
