<div #container class="notes-widget">
  <ng-container *ngIf="notes.length > 0; else noNotes">
    <ul class="notes-widget-list">
      <li *ngFor="let note of visibleNotes">
        <div class="note-row">
          <span class="note-title">{{ note.title }}</span>
        </div>
      </li>
    </ul>
  </ng-container>

  <ng-template #noNotes>
    <div class="no-notes">✅ Keine offenen Notizen</div>
  </ng-template>
</div>
