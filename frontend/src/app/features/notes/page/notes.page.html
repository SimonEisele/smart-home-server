<div class="notes-page">

  <h1>📝 Notizen</h1>

  <ng-container *ngIf="categoryTree.length > 0; else empty">

    <ul class="category-list">
      <ng-container *ngFor="let category of categoryTree">
        <ng-template
          [ngTemplateOutlet]="categoryTpl"
          [ngTemplateOutletContext]="{ category: category }">
        </ng-template>
      </ng-container>
    </ul>

  </ng-container>

  <ng-template #empty>
    <div class="empty">Keine Notizen vorhanden</div>
  </ng-template>

  <!-- Recursive template -->
  <ng-template #categoryTpl let-category="category">
    <li class="category-node">

      <div class="category-header" (click)="toggle(category)">
        <span class="chevron">
          {{ category.expanded ? '▼' : '▶' }}
        </span>
        <span class="title">{{ category.title }}</span>
      </div>

      <ul *ngIf="category.expanded" class="category-content">

        <!-- Notes -->
        <li *ngFor="let note of category.notes" class="note">
          <div class="note-title">{{ note.title }}</div>
          <div class="note-meta">
            {{ note.updatedAt | date:'dd.MM.yyyy' }}
            <span *ngIf="note.global" class="global">🌍</span>
          </div>
        </li>

        <!-- Children -->
        <ng-container *ngFor="let child of category.children">
          <ng-template
            [ngTemplateOutlet]="categoryTpl"
            [ngTemplateOutletContext]="{ category: child }">
          </ng-template>
        </ng-container>

      </ul>

    </li>
  </ng-template>

</div>
