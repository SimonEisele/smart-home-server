<ul class="todo-list">
  <li *ngFor="let todo of todos">
    <div class="todo-title">{{ todo.title }}</div>

    <div class="todo-meta">
      <span class="due">
        {{ todo.dueDate | date:'dd.MM.yyyy' }}
      </span>

      <div class="progress">
        <div
          class="progress-bar"
          [style.width.%]="todo.progress ?? 0">
        </div>
      </div>

      <span class="percent">{{ todo.progress ?? 0 }}%</span>
    </div>
  </li>
</ul>
