<div class="login-popover-panel">
  <div class="popover-arrow" [style.left.px]="arrowLeft"></div>
  <!-- E-Mail Form -->
  <form class="row" id="emailForm" (ngSubmit)="checkEmail()" autocomplete="on">
    <div class="col-md-12 mb-3">
      <label class="form-label" for="inputEmail">E-Mail</label>
      <input #emailInput class="form-control" id="inputEmail" type="email" [(ngModel)]="email" name="email" autocomplete="username">
      <div class="text-danger error" *ngIf="emailError">* Kein Account gefunden</div>
    </div>
    <div class="mb-3 form-check d-flex justify-content-end" *ngIf="!showPasswordForm">
      <button type="submit" class="btn btn-secondary mt-2">Weiter</button>
    </div>
  </form>

  <!-- Passwort Form -->
  <form class="row" id="passwordForm" *ngIf="showPasswordForm" (ngSubmit)="checkPassword()" autocomplete="on">
    <div class="col-md-12 mb-3">
      <label class="form-label" for="inputPassword">Passwort</label>
      <div class="input-group">
        <input #passwordInput class="form-control" id="inputPassword" type="password" [(ngModel)]="password" name="password" autocomplete="current-password">
        <div class="input-group-text" (click)="togglePassword()"><img src="{{passwordToggleIcon}}" alt="" width="20" height="20" tabindex="-1"></div>
      </div>
      <div class="text-danger error" *ngIf="passwordError">* Passwort falsch</div>
      <div class="mt-3 form-check">
        <input class="form-check-input" id="rememberMeCheck" type="checkbox" [(ngModel)]="rememberMe" name="remeberMe" checked>
        <label class="form-check-label" for="rememberMeCheck">
          Angemeldet bleiben
        </label>
      </div>
    </div>
    <div class="mb-3 form-check d-flex justify-content-end">
      <button type="submit" class="btn btn-primary mt-2">Login</button>
    </div>
  </form>

  <!-- Create Account -->
  <div class="row">
    <hr>
    <p>Noch keinen Account? <a class="link" routerLink="/register" (click)="closePopover()">Jetzt erstellen</a></p>
  </div>
</div>
