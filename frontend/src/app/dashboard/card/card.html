<div class="dash-card" [class.edit-mode]="editMode" [class.clickable]="!editMode && !!link" (click)="onCardClick($event)">
  <div class="dash-card-header">
    <img class="card-icon" [src]="'/icons/' + icon" alt="" />
    <span class="card-title">{{ title }}</span>
    <div class="header-actions">
      <button *ngIf="!editMode && link" class="btn-open" (click)="navigate(); $event.stopPropagation()" [title]="title + ' öffnen'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
      <button *ngIf="editMode" class="btn-remove" (click)="$event.stopPropagation(); remove.emit()" title="Entfernen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="dash-card-content">
    <ng-content></ng-content>
  </div>
</div>
